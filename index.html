<style>
/* ---------- Sistema de diseño (reducido) ---------- */
:root {
  --paper: #F6F3EC; --paper-raised: #FFFFFF; --ink: #211F1A; --ink-soft: #55554C;
  --line: #DEDACD; --teal: #163C36; --teal-strong: #0F2B27; --teal-tint: #E4ECE9;
  --ochre: #C1732E; --ochre-tint: #F3E1CC; --stamp: #A6402F;
  --shadow: 0 1px 2px rgba(33,31,26,.06), 0 8px 24px -12px rgba(33,31,26,.18);
  --radius-s: 6px; --radius-m: 12px; --radius-l: 20px;
  --font-display: Georgia, 'Times New Roman', serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
}
[data-theme="dark"] {
  --paper: #14170F; --paper-raised: #1D2118; --ink: #ECE8DE; --ink-soft: #A9A599;
  --line: #333427; --teal: #6FBBAA; --teal-strong: #8FD0C0; --teal-tint: #1D2924;
  --ochre: #E2A268; --ochre-tint: #2B2419; --stamp: #D9705B;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body); line-height:1.5; }
img { max-width:100%; } a { color:inherit; } button { font-family:inherit; cursor:pointer; }
h1,h2,h3 { font-family:var(--font-display); font-weight:700; margin:0 0 .4em; }
.container { max-width:1080px; margin:0 auto; padding:0 20px; }
:focus-visible { outline:2px solid var(--ochre); outline-offset:2px; }

.site-header { position:sticky; top:0; z-index:40; background:var(--paper); border-bottom:1px solid var(--line); }
.site-header .container { display:flex; align-items:center; justify-content:space-between; height:64px; }
.brand { font-family:var(--font-display); font-weight:700; font-size:1.25rem; text-decoration:none; color:var(--ink); }
.brand span { color:var(--ochre); }
.main-nav a { display:inline-block; padding:8px 10px; border-radius:6px; text-decoration:none; font-size:.9rem; font-weight:600; color:var(--ink-soft); }
.main-nav a:hover, .main-nav a.active { color:var(--ink); background:var(--teal-tint); }
.theme-toggle { border:1px solid var(--line); background:var(--paper-raised); width:36px; height:36px; border-radius:50%; margin-left:6px; }

.hero { padding:48px 0 32px; background:linear-gradient(180deg,var(--teal-tint),var(--paper) 70%); border-bottom:1px solid var(--line); }
.hero h1 { font-size:clamp(1.7rem,4vw,2.6rem); max-width:16ch; color:var(--teal-strong); }
[data-theme="dark"] .hero h1 { color:var(--ink); }
.hero p { color:var(--ink-soft); max-width:48ch; margin-bottom:22px; }

.search-panel { background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:18px; display:grid; gap:12px; }
.search-row { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:10px; }
@media (max-width:700px){ .search-row{ grid-template-columns:1fr; } }
.field label { display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:5px; }
.field input, .field select { width:100%; padding:10px 11px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--paper); color:var(--ink); font-size:.92rem; }

.btn { border:none; border-radius:var(--radius-s); padding:10px 16px; font-weight:700; font-size:.9rem; }
.btn-primary { background:var(--teal); color:#fff; }
.btn-ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }

.section { padding:36px 0; }
.section-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; gap:10px; flex-wrap:wrap; }
.section-head h2 { font-size:1.3rem; }
.muted { color:var(--ink-soft); font-size:.88rem; }

.school-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
.school-card { background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); overflow:hidden; box-shadow:var(--shadow); text-decoration:none; color:var(--ink); display:flex; flex-direction:column; }
.school-card .thumb { height:78px; background:linear-gradient(135deg,var(--teal-tint),var(--ochre-tint)); position:relative; padding:9px; }
.school-card .type-tag { background:var(--teal-strong); color:#fff; font-size:.66rem; font-weight:700; padding:3px 9px; border-radius:999px; font-family:var(--font-mono); }
.school-card .fav-btn { position:absolute; top:8px; right:8px; background:rgba(255,255,255,.85); border:none; width:28px; height:28px; border-radius:50%; color:var(--stamp); }
.school-card .body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:6px; }
.school-card h3 { font-size:1.02rem; margin:0; }
.school-card .place { color:var(--ink-soft); font-size:.82rem; }
.rating-row { display:flex; align-items:center; gap:8px; }
.rating-pill { background:var(--teal); color:#fff; font-family:var(--font-mono); font-weight:700; font-size:.82rem; padding:3px 8px; border-radius:6px; }
.rating-row .count { color:var(--ink-soft); font-size:.76rem; }
.rating-pill-empty { background:var(--line); color:var(--ink-soft); font-weight:500; }

.selo { width:82px; height:82px; border-radius:50%; border:3px double var(--stamp); color:var(--stamp); display:flex; flex-direction:column; align-items:center; justify-content:center; transform:rotate(-8deg); font-family:var(--font-mono); flex-shrink:0; }
.selo .num { font-size:1.5rem; font-weight:700; line-height:1; }
.selo .label { font-size:.5rem; text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }

.school-hero { background:var(--teal-strong); color:#fff; padding:30px 0 24px; }
.school-hero .container { display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.school-hero h1 { color:#fff; font-size:clamp(1.4rem,3vw,2rem); }
.school-hero .tags span { font-size:.72rem; font-family:var(--font-mono); background:rgba(255,255,255,.12); padding:4px 9px; border-radius:999px; margin-right:6px; }
.school-hero .actions { margin-top:12px; display:flex; gap:8px; }

.doc-layout { display:grid; grid-template-columns:190px 1fr; gap:22px; padding:26px 0 56px; align-items:start; }
@media (max-width:800px){ .doc-layout{ grid-template-columns:1fr; } }
.tab-nav { position:sticky; top:78px; display:flex; flex-direction:column; gap:2px; }
.tab-nav button { text-align:left; background:transparent; border:none; border-left:3px solid transparent; padding:9px 10px; font-size:.86rem; color:var(--ink-soft); font-weight:600; border-radius:0 8px 8px 0; }
.tab-nav button.is-active { border-left-color:var(--ochre); color:var(--ink); background:var(--teal-tint); }

.doc-panel { background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px 24px; box-shadow:var(--shadow); }

.score-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px 20px; }
.score-item { display:flex; align-items:center; gap:9px; }
.score-item .name { flex:1; font-size:.85rem; color:var(--ink-soft); }
.score-bar { width:80px; height:6px; background:var(--line); border-radius:4px; overflow:hidden; }
.score-bar>i { display:block; height:100%; background:var(--teal); }
.score-item .val { font-family:var(--font-mono); font-size:.82rem; font-weight:700; width:28px; text-align:right; }

.info-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
.info-item { background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-s); padding:11px 13px; }
.info-item .k { font-size:.68rem; text-transform:uppercase; color:var(--ink-soft); }
.info-item .v { font-family:var(--font-mono); font-weight:700; margin-top:3px; }
.service-tags { display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; }
.service-tags span { font-size:.78rem; padding:5px 10px; border-radius:999px; border:1px solid var(--line); }
.service-tags span.yes { background:var(--teal-tint); border-color:transparent; color:var(--teal); }
.service-tags span.no { color:var(--ink-soft); text-decoration:line-through; opacity:.6; }

.note-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.note-list li { padding:10px 12px; background:var(--paper); border-left:3px solid var(--ochre); border-radius:0 6px 6px 0; font-size:.9rem; }

.review-card { border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px; background:var(--paper); }
.review-card .head { display:flex; justify-content:space-between; margin-bottom:5px; }
.review-card .author { font-weight:700; font-size:.86rem; }
.review-card .date { font-size:.74rem; color:var(--ink-soft); font-family:var(--font-mono); }
.review-card .stars { color:var(--ochre); font-size:.8rem; margin-bottom:4px; }
.review-card p { margin:0; font-size:.9rem; }
.review-form { display:grid; gap:10px; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); }
.rating-inputs { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:10px 18px; }
.rating-input label { display:flex; justify-content:space-between; font-size:.8rem; color:var(--ink-soft); margin-bottom:3px; }
.rating-input output { font-family:var(--font-mono); font-weight:700; color:var(--ochre); }
.rating-input input[type=range] { width:100%; accent-color:var(--teal); }
.review-form textarea { width:100%; min-height:80px; padding:9px 11px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:inherit; resize:vertical; }
.star-select { display:flex; gap:4px; font-size:1.2rem; }
.star-select button { background:none; border:none; color:var(--line); padding:0; }
.star-select button.active { color:var(--ochre); }

.empty-state { text-align:center; padding:50px 16px; color:var(--ink-soft); }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--teal-strong); color:#fff; padding:10px 18px; border-radius:999px; font-size:.86rem; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s; z-index:100; }
.toast.show { opacity:1; }
.site-footer { border-top:1px solid var(--line); padding:24px 0; margin-top:30px; color:var(--ink-soft); font-size:.82rem; text-align:center; }
.map-box { height:480px; border-radius:var(--radius-l); overflow:hidden; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); background:var(--paper-raised); }
.map-legend { display:flex; align-items:center; gap:16px; margin-top:12px; font-size:.8rem; color:var(--ink-soft); flex-wrap:wrap; }
.map-legend span { display:flex; align-items:center; gap:6px; }
.map-legend i { width:11px; height:11px; border-radius:50%; display:inline-block; }
</style>
</head>

/* ---------- Almacenamiento local (con reserva en memoria si el navegador bloquea localStorage en file://) ---------- */
const memoryStore = {};
function readJSON(k, fb){
  try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }
  catch(e){ return (k in memoryStore) ? memoryStore[k] : fb; }
}
function writeJSON(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ memoryStore[k] = v; }
}
const getFavorites = () => readJSON("edubk_lite_favs", []);
const isFavorite = (id) => getFavorites().includes(id);
function toggleFavorite(id){ const f=getFavorites(); const i=f.indexOf(id); if(i>=0)f.splice(i,1); else f.push(id); writeJSON("edubk_lite_favs", f); return f.includes(id); }
const getUserReviews = (id) => readJSON("edubk_lite_reviews", {})[id] || [];
function addUserReview(id, review){ const all=readJSON("edubk_lite_reviews", {}); if(!all[id])all[id]=[]; all[id].unshift(review); writeJSON("edubk_lite_reviews", all); }
const getTheme = () => readJSON("edubk_lite_theme", "light");
const setTheme = (t) => writeJSON("edubk_lite_theme", t);

/* ---------- Utilidades ---------- */
const root = document.getElementById("view-root");
const navLinks = document.querySelectorAll(".main-nav a");
function avgScore(scores){ const v=Object.values(scores); return v.reduce((a,b)=>a+b,0)/v.length; }
const BASE_WEIGHT = 12; // peso implícito de la puntuación base de cada centro
const ALL_CATEGORIES = ["ambiente", "horario", "acceso", "organizacion", "recursos"];
function computeScores(s){
  const userScored = getUserReviews(s.id).filter(r=>r.scores);
  const hasBase = !!s.scores;
  if(!hasBase && userScored.length===0) return null;
  const categories = hasBase ? Object.keys(s.scores) : ALL_CATEGORIES;
  const result = {};
  categories.forEach(cat=>{
    const base = hasBase ? s.scores[cat] : null;
    const extra = userScored.map(r=>r.scores[cat]).filter(v=>typeof v==="number");
    if(base==null && extra.length===0) return;
    const totalWeight = (base!=null ? BASE_WEIGHT : 0) + extra.length;
    const sum = (base!=null ? base*BASE_WEIGHT : 0) + extra.reduce((a,b)=>a+b,0);
    result[cat] = sum/totalWeight;
  });
  return Object.keys(result).length ? result : null;
}
function allReviews(s){ return [...getUserReviews(s.id), ...(s.opiniones||[])]; }
function cap(str){ return str.charAt(0).toUpperCase()+str.slice(1); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg){
  let t=document.querySelector(".toast");
  if(!t){ t=el('<div class="toast"></div>'); document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove("show"), 2000);
}

function schoolCard(s){
  const computed = computeScores(s);
  const avg = computed ? avgScore(computed).toFixed(1) : null;
  const n = allReviews(s).length;
  const fav = isFavorite(s.id);
  return `
    <a href="#/colegio/${s.id}" class="school-card">
      <div class="thumb">
        <span class="type-tag">${s.tipo}</span>
        <button class="fav-btn" data-fav="${s.id}" title="Guardar en favoritos">${fav?"★":"☆"}</button>

      </div>
    </a>`;
}

function bindFavButtons(container){
  container.querySelectorAll("[data-fav]").forEach(btn=>{
    btn.addEventListener("click", ev=>{

      const nowFav = toggleFavorite(btn.getAttribute("data-fav"));
      btn.textContent = nowFav ? "★" : "☆";

  });
}

/* ---------- Router ---------- */
function parseHash(){ const raw=location.hash.slice(1)||"/"; const [path,qs]=raw.split("?"); return {path, params:new URLSearchParams(qs||"")}; }
function navigate(){
  const {path, params} = parseHash();
  window.scrollTo(0,0);
  navLinks.forEach(a=>a.classList.toggle("active", a.getAttribute("href")==="#"+path.split("/").slice(0,2).join("/")));
  if(path==="/"||path==="") return renderHome();
  if(path==="/buscar") return renderSearch(params);
  if(path.startsWith("/colegio/")) return renderSchool(path.split("/")[2], params);
  if(path==="/favoritos") return renderFavorites();
  if(path==="/mapa") return renderMap();
  return renderNotFound();
}
window.addEventListener("hashchange", navigate);

function bindSearchPanel(){
  const form = document.getElementById("search-form");
  if(!form) return;
  form.addEventListener("submit", ev=>{
    ev.preventDefault();
    const p = new URLSearchParams();
    if(document.getElementById("q").value) p.set("q", document.getElementById("q").value);
    if(document.getElementById("provincia").value) p.set("provincia", document.getElementById("provincia").value);
    if(document.getElementById("tipo").value) p.set("tipo", document.getElementById("tipo").value);
    location.hash = "/buscar?" + p.toString();
  });
}

function filterSchools(q, provincia, tipo){
  q = (q||"").toLowerCase().trim();
  return SCHOOLS.filter(s=>{
    if(q && !(s.nombre.toLowerCase().includes(q) || s.localidad.toLowerCase().includes(q))) return false;
    if(provincia && s.provincia!==provincia) return false;
    if(tipo && s.tipo!==tipo) return false;
    return true;
  });
}

function renderSearch(params){
  const q = params.get("q")||"", provincia = params.get("provincia")||"", tipo = params.get("tipo")||"";
  root.innerHTML = `
    <section class="section container">
      ${searchPanelHTML({q, provincia, tipo})}
      <div id="results-area"></div>
    </section>`;
  const MAX_RESULTS_SHOWN = 60;
  const resultsArea = document.getElementById("results-area");
  function paint(qVal, provVal, tipoVal){
    const results = filterSchools(qVal, provVal, tipoVal);
    const shown = results.slice(0, MAX_RESULTS_SHOWN);
    resultsArea.innerHTML = `
      <div class="section-head" style="margin-top:22px"><h2>${results.length} centro${results.length===1?"":"s"} encontrado${results.length===1?"":"s"}</h2></div>
      ${results.length > MAX_RESULTS_SHOWN ? `<p class="muted" style="margin-bottom:12px">Mostrando los primeros ${MAX_RESULTS_SHOWN} — afina la búsqueda para ver el resto.</p>` : ""}
      ${shown.length ? `<div class="school-grid">${shown.map(schoolCard).join("")}</div>` : emptyState("Sin resultados","Prueba a quitar algún filtro o busca por otra localidad.")}`;
    bindFavButtons(resultsArea);
  }
  paint(q, provincia, tipo);
  bindSearchPanel();
  const qInput = document.getElementById("q");
  let timer;
  qInput.addEventListener("input", ()=>{
    clearTimeout(timer);
    timer = setTimeout(()=>paint(qInput.value, document.getElementById("provincia").value, document.getElementById("tipo").value), 200);
  });

  document.getElementById("tipo").addEventListener("change", ()=>paint(qInput.value, document.getElementById("provincia").value, document.getElementById("tipo").value));
}

/* ---------- Mapa ---------- */
let leafletLoading = null;
function ensureLeaflet(){
  if(window.L) return Promise.resolve();
  if(leafletLoading) return leafletLoading;
  leafletLoading = new Promise((resolve, reject)=>{
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(link);
    const script = document.createElement("script");
    script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
  return leafletLoading;
}
function scoreColor(avg){
  if(avg>=8) return "#3F6B4E";
  if(avg>=6) return "#C1732E";
  return "#A6402F";
}
function renderMap(){
  root.innerHTML = `
    <section class="section container">
      <div class="section-head">
        <h2>Mapa de centros</h2>
        <span class="muted">Color según valoración media · ${SCHOOLS.length} centros</span>
      </div>
      <div id="map-el" class="map-box">Cargando mapa…</div>
      <div class="map-legend">
        <span><i style="background:#3F6B4E"></i> 8 – 10</span>
        <span><i style="background:#C1732E"></i> 6 – 7.9</span>
        <span><i style="background:#A6402F"></i> &lt; 6</span>
        <span><i style="background:#9A9587"></i> Sin valorar</span>
      </div>
    </section>`;

  ensureLeaflet().then(()=>{
    const mapEl = document.getElementById("map-el");
    if(!mapEl) return; // el usuario ya navegó a otra vista
    mapEl.textContent = "";
    const map = window.L.map(mapEl).setView([42.75, -7.9], 8);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors", maxZoom: 18
    }).addTo(map);

    SCHOOLS.forEach(s=>{
      const computed = computeScores(s);
      const avg = computed ? avgScore(computed) : null;
      const marker = window.L.circleMarker([s.lat, s.lng], {
        radius: avg!=null ? 8 : 5, color:"#fff", weight:2,
        fillColor: avg!=null ? scoreColor(avg) : "#9A9587", fillOpacity:0.95
      }).addTo(map);
      const notaHtml = avg!=null ? `Nota: ${avg.toFixed(1)}/10` : "Sin valorar todavía";
      marker.bindPopup(`<strong>${s.nombre}</strong><br>${s.localidad}, ${s.provincia}<br>${notaHtml}<br><a href="#/colegio/${s.id}">Ver ficha →</a>`);
    });
  }).catch(()=>{
    const mapEl = document.getElementById("map-el");
    if(mapEl) mapEl.textContent = "No se pudo cargar el mapa (revisa la conexión a internet).";
  });
}

function tabContent(s, tab){
  if(tab==="valoraciones"){
    const computed = computeScores(s);
    if(!computed) return `<h2>Puntuaciones</h2>${contributePrompt("Este centro todavía no tiene valoraciones. Ve a «Opiniones» y sé el primero en puntuarlo.")}`;
    return `<h2>Puntuaciones</h2><p class="muted" style="margin-top:-8px;margin-bottom:14px">Media entre la base del centro y las opiniones de la comunidad.</p><div class="score-grid">${Object.entries(computed).map(([k,v])=>`
      <div class="score-item"><span class="name">${SCORE_LABELS[k]}</span><span class="score-bar"><i style="width:${v*10}%"></i></span><span class="val">${v.toFixed(1)}</span></div>`).join("")}</div>`;
  }
  if(tab==="info"){
    const oficial = `
      <h3 style="margin-top:${s.curated?"20px":"0"}">Datos de contacto</h3>
      <div class="info-grid">
        <div class="info-item"><div class="k">Dirección</div><div class="v">${s.direccion||"—"}</div></div>
        <div class="info-item"><div class="k">Código postal</div><div class="v">${s.cp||"—"}</div></div>
        <div class="info-item"><div class="k">Teléfono</div><div class="v">${s.telefono||"—"}</div></div>
        <div class="info-item"><div class="k">Titularidad</div><div class="v">${s.titularidad||"—"}</div></div>
      </div>`;
    if(!s.horario){
      return `<h2>Información práctica</h2>${oficial}<p class="muted" style="margin-top:16px">Aún no hay horario ni servicios registrados por la comunidad para este centro.</p>`;
    }
    return `<h2>Información práctica</h2>
      <div class="info-grid">
        <div class="info-item"><div class="k">Entrada</div><div class="v">${s.horario.entrada}</div></div>
        <div class="info-item"><div class="k">Salida</div><div class="v">${s.horario.salida}</div></div>
        <div class="info-item"><div class="k">Recreo</div><div class="v">${s.horario.recreo}</div></div>
      </div>
      <h3 style="margin-top:20px">Servicios</h3>
      <div class="service-tags">${Object.entries(SERVICE_LABELS).map(([k,label])=>`<span class="${s.servicios[k]?"yes":"no"}">${label}</span>`).join("")}</div>
      ${oficial}`;
  }
  if(tab==="saber"){
    if(!s.saber || !s.saber.length) return `<h2>Lo que debes saber</h2>${contributePrompt("Todavía nadie ha compartido consejos prácticos sobre este centro.")}`;
    return `<h2>Lo que debes saber</h2><ul class="note-list">${s.saber.map(n=>`<li>${n}</li>`).join("")}</ul>`;
  }
  if(tab==="sustituciones"){
    const sub = s.sustituciones;
    if(!sub) return `<h2>Sustituciones</h2>${contributePrompt("Todavía no hay datos sobre cómo son las sustituciones en este centro.")}`;
    return `<h2>Sustituciones</h2><div class="info-grid">
      <div class="info-item"><div class="k">Frecuencia</div><div class="v">${cap(sub.frecuencia)}</div></div>
      <div class="info-item"><div class="k">Duración habitual</div><div class="v">${cap(sub.duracionHabitual)}</div></div>
      <div class="info-item"><div class="k">Rapidez de llamada</div><div class="v">${cap(sub.rapidezLlamada)}</div></div>
    </div>`;
  }
  if(tab==="ambiente"){
    const reviews = allReviews(s);
    return `<h2>Opiniones</h2>
      ${reviews.map(r=>`<div class="review-card"><div class="head"><span class="author">${r.autor}</span><span class="date">${r.fecha}</span></div>
        <div class="stars">${"★".repeat(Math.round(r.nota/2))}${"☆".repeat(5-Math.round(r.nota/2))} <span style="font-family:var(--font-mono);color:var(--ink-soft)">${r.nota.toFixed(1)}/10</span></div>
        <p>${r.texto}</p></div>`).join("")}
      <form class="review-form" id="review-form">
        <h3 style="margin:0">Añadir tu opinión</h3>
        <p class="muted" style="margin:-4px 0 4px">Puntúa cada apartado — se combina con la puntuación actual del centro.</p>
        <div class="rating-inputs">${Object.entries(SCORE_LABELS).map(([k,label])=>`
          <div class="rating-input">
            <label for="rt-${k}">${label} <output for="rt-${k}" id="rt-${k}-val">7</output></label>
            <input type="range" id="rt-${k}" data-cat="${k}" min="1" max="10" step="1" value="7">
          </div>`).join("")}</div>
        <textarea id="review-text" placeholder="Cuenta tu experiencia..." required></textarea>
        <button class="btn btn-primary" type="submit" style="justify-self:start">Publicar opinión</button>
      </form>`;
  }
  return "";
}

function bindReviewForm(s){
  const form = document.getElementById("review-form");
  if(!form) return;
  form.querySelectorAll("input[type=range]").forEach(input=>{
    const out = document.getElementById(`${input.id}-val`);
    input.addEventListener("input", ()=>{ if(out) out.textContent = input.value; });
  });
  form.addEventListener("submit", ev=>{
    ev.preventDefault();
    const texto = document.getElementById("review-text").value.trim();
    if(!texto) return;
    const scores = {};
    form.querySelectorAll("input[type=range]").forEach(input=>{ scores[input.dataset.cat] = Number(input.value); });
    const nota = avgScore(scores);
    addUserReview(s.id, {autor:"Tú", nota, fecha:new Date().toISOString().slice(0,10), texto, scores});
    toast("Opinión publicada, la puntuación media ya se ha actualizado");
    renderTabPanel(s, "ambiente");
    const ratingNum = document.getElementById("rating-num");
    if(ratingNum) ratingNum.textContent = avgScore(computeScores(s)).toFixed(1);
  });
}

/* ---------- Tema ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  const btn = document.getElementById("theme-toggle");
  if(btn) btn.textContent = theme==="dark" ? "☀️" : "🌙";
}
document.getElementById("theme-toggle").addEventListener("click", ()=>{
  const current = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  setTheme(current); applyTheme(current);
});

applyTheme(getTheme());
navigate();
</script>
</body>
</html>
